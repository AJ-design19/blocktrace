services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blocktrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: blocktrace
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U blocktrace"], interval: 5s, retries: 10 }

  api:
    build: ./backend
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg2://blocktrace:${POSTGRES_PASSWORD}@db:5432/blocktrace
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-}
      CHAIN_CONTRACT_ADDRESS: ${CHAIN_CONTRACT_ADDRESS:-}
      CHAIN_PRIVATE_KEY: ${CHAIN_PRIVATE_KEY:-}
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]

  web:
    build:
      context: ./frontend
      args: { VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:8000}" }
    depends_on: [api]
    ports: ["8080:80"]

  chain:            # local dev blockchain: docker compose --profile chain up
    profiles: ["chain"]
    image: node:22-alpine
    working_dir: /app
    volumes: ["./contracts:/app"]
    command: sh -c "npm ci && npx hardhat node --hostname 0.0.0.0"
    ports: ["8545:8545"]

volumes: { pgdata: {} }
